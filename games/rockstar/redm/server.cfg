# RedM Server Configuration
# Documentation: https://redm.gg/docs/manual/server-setup

## Network configuration
endpoint_add_tcp "0.0.0.0:${TXHOST_FXS_PORT:-30120}"
endpoint_add_udp "0.0.0.0:${TXHOST_FXS_PORT:-30120}"

## Server identification
sv_hostname "NodeByte Hosting - RedM Basic"
sets sv_projectName "[NBH] RedM Basic"
sets sv_projectDesc "A basic RedM server!"

## License key (from https://portal.cfx.re/)
sv_licenseKey "${TXHOST_DEFAULT_CFXKEY:-${REDM_LICENSE}}"

## Server settings
sv_maxclients ${MAX_PLAYERS:-32}
set steam_webApiKey "none"

## Metadata
sets tags "default, redm"
sets locale "en-GB"

## Resources to start by default
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
