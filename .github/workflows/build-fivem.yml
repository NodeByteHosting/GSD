name: Build and Push FiveM Recipe to GHCR

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'rockstar/fivem/**'
      - '.github/workflows/build-fivem.yml'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to GHCR'
        required: false
        default: 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nodebyte/games

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-fivem
            type=semver,pattern={{version}},prefix=fivem-
            type=semver,pattern={{major}}.{{minor}},prefix=fivem-
            type=sha,prefix=fivem-
            type=raw,value=fivem-dev,enable={{is_default_branch}},branch=dev
            type=raw,value=fivem-dev,enable={{is_default_branch}},branch=develop
            type=raw,value=fivem,enable={{is_default_branch}},branch=main
            type=raw,value=fivem,enable={{is_default_branch}},branch=master
            type=raw,value=latest,enable={{is_default_branch}},branch=main

      - name: Build and push FiveM image
        uses: docker/build-push-action@v5
        with:
          context: ./rockstar/fivem
          file: ./rockstar/fivem/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:fivem
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-fivem
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-fivem,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  publish-recipe:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload recipe artifact
        uses: actions/upload-artifact@v4
        with:
          name: fivem-recipe
          path: rockstar/fivem/recipe.json
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: rockstar/fivem/recipe.json
          body: |
            FiveM Recipe for Pterodactyl/Custom Panels
            
            Docker Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:fivem`
            
            **Recipe Features:**
            - txAdmin integration
            - Configurable ports and player slots
            - Auto-update support
            - Provider branding options
