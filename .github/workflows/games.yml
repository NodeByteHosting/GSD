name: Build Games

on:
  workflow_dispatch:
  
  schedule:
    - cron: "0 0 1 * *"
  
  push:
    branches:
      - main
      - develop
    paths:
      - 'games/**'
      - '.github/workflows/games.yml'
  
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: "games:${{ matrix.game }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        game:
          - minecraft
          - rockstar/fivem
          - rockstar/redm
          - rust
          - hytale
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "./games/${{ matrix.game }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image name
        id: image
        run: |
          GAME="${{ matrix.game }}"
          IMAGE_NAME="${GAME##*/}"
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Generate tags
        if: steps.check.outputs.exists == 'true'
        id: tags
        run: |
          OWNER="${{ steps.owner.outputs.value }}"
          IMAGE="${{ steps.image.outputs.name }}"
          TAGS="${{ env.REGISTRY }}/$OWNER/games:$IMAGE"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/$OWNER/games:latest"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/$OWNER/games:$IMAGE-dev"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/$OWNER/games:$VERSION"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./games/${{ matrix.game }}
          file: ./games/${{ matrix.game }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
