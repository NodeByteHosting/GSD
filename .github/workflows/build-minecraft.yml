name: build minecraft

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 1 * *"

  push:
    branches:
      - main

    paths:
      - "games/minecraft/**"
      - ".github/workflows/build-minecraft.yml"

env:
  REGISTRY: ghcr.io

jobs:
  push:
    name: "games:minecraft"

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "./games/minecraft/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6

        with:
          context: ./games/minecraft
          file: ./games/minecraft/Dockerfile

          push: true

          platforms: linux/amd64

          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/games:minecraft
            ghcr.io/${{ steps.owner.outputs.value }}/games:minecraft-latest

          cache-from: type=gha
          cache-to: type=gha,mode=max